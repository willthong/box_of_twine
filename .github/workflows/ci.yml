name: CI

on:
  push:
  pull_request:

# Least privilege by default; the container job opts into packages: write.
permissions:
  contents: read

jobs:
  test:
    name: pytest, ruff, ty
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: pytest
        run: uv run pytest

      - name: ruff
        run: uv run ruff check

      - name: ty
        run: uv run ty check

  container:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Pull requests build the image to prove the Dockerfile still works
          # but never push; only main and tags publish to GHCR.
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make the GHCR package public
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # A package published from a private repo is private by default.
          # Flip it to public: user-owned repos use /user, org-owned use /orgs.
          gh api --method PATCH "/user/packages/container/${PACKAGE}" -f visibility=public \
            || gh api --method PATCH "/orgs/${OWNER}/packages/container/${PACKAGE}" -f visibility=public
