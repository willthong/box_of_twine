[project]
name = "box-of-twine"
version = "0.1.0"
description = "Self-hosted multi-user Twine: vendored editor, per-user story storage, sharing, and publication."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "gunicorn>=23.0.0",
    "werkzeug>=3.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/box_of_twine"]

[tool.ruff]
line-length = 90

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.88",
]
